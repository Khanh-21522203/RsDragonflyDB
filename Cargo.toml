[package]
name = "RsDragonflyDB"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[[bin]]
name = "RsDragonflyDB"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
log = "0.4"
env_logger = "0.11"
crc = "3.0"
byteorder = "1.5.0"
futures = "0.3.31"
clap = { version = "4.5.54", features = ["derive"] }
serde_json = "1.0.149"
